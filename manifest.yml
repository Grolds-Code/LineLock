modules:
  jira:issuePanel:
    - key: ll-eco-panel
      resource: main-ui
      resolver:
        function: panel-resolver-fn
      render: native
      title: LineLock Verification Harness
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg

  jira:workflowValidator:
    - key: ll-release-validator
      name: LineLock Effectivity-Aware Evidence Gate
      description: Blocks ECO release transitions unless all effective serial slices, operating envelopes, and generation-bound role attestations are verified.
      function: workflow-validator-fn

  trigger:
    - key: ll-issue-reconciler
      function: issue-updated-fn
      events:
        - avi:jira:updated:issue
    - key: ll-lifecycle-trigger
      function: lifecycle-fn
      events:
        - avi:forge:installed:app
        - avi:forge:upgraded:app

  consumer:
    - key: ll-migration-consumer
      queue: schema-migration-queue
      function: migration-worker-fn

  sql:
    - key: main
      engine: mysql

  function:
    - key: panel-resolver-fn
      handler: forge/index.panelResolverHandler
    - key: workflow-validator-fn
      handler: forge/index.workflowValidatorHandler
    - key: issue-updated-fn
      handler: forge/index.issueUpdatedTriggerHandler
    - key: lifecycle-fn
      handler: forge/index.lifecycleInstallTriggerHandler
    - key: migration-worker-fn
      handler: forge/index.migrationQueueConsumerHandler

resources:
  - key: main-ui
    path: src/frontend/index.tsx

permissions:
  scopes:
    - storage:app
    - read:jira-work
    - read:jira-user

app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/00000000-0000-0000-0000-000000000000
