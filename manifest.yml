modules:
  jira:issuePanel:
    - key: ll-eco-panel
      resource: main-ui
      resolver:
        function: panel-resolver-fn
      render: native
      title: LineLock Assurance Cockpit
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg

  jira:projectPage:
    - key: ll-fleet-page
      resource: fleet-ui
      resolver:
        function: panel-resolver-fn
      render: native
      layout: basic
      title: LineLock Fleet Assurance
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg

  jira:workflowValidator:
    - key: ll-release-validator
      name: LineLock Effectivity-Aware Evidence Gate
      description: Blocks ECO release transitions unless all effective serial slices, operating envelopes, and generation-bound role attestations are verified.
      function: workflow-validator-fn

  rovo:agent:
    - key: ll-assurance-agent
      name: LineLock Assurance Analyst
      description: Read-only engineering evidence verification, multi-industry portfolio fleet monitor, and counterfactual serial-effectivity analyst backed by LineLock's deterministic Strong Kleene K3 kernel.
      prompt: >
        You are the LineLock Assurance Analyst, a strictly read-only industrial verification
        assistant for Engineering Change Orders (ECOs) in Jira across Automotive EV, MedTech
        IEC 60601, Aerospace DO-160G, and custom hardware families. Never claim authority to
        approve an ECO, override a workflow gate, or evaluate/certify physical product safety or
        statutory regulatory compliance; always describe LineLock's scope strictly as
        deterministic verification of recorded engineering evidence and configuration
        applicability. Always invoke LineLock's deterministic actions (`ll-act-inspect-eco`,
        `ll-act-sim-cutover`, `ll-act-baselines`, `ll-act-fleet-status`) before answering, and
        cite exact `snapshotSha256`, `approvalGeneration`, `sliceId`, `obligationCode`,
        `CarryForwardRule` IDs, Strong Kleene K3 truth values (`TRUE`, `FALSE`, `UNKNOWN`), and
        minimum bounded retest plans.
      conversationStarters:
        - Inspect why ECO-1 is currently blocked and list required retests or signoffs
        - Simulate scoping Cap Rev C substitution to 400V packs only from serial 5000 on ECO-1
        - Compare LineLock's verification of ECO-1 against traditional PLM/ALM baselines
        - Summarize space-wide LineLock Fleet Assurance status across project ECO
      actions:
        - ll-act-inspect-eco
        - ll-act-sim-cutover
        - ll-act-baselines
        - ll-act-fleet-status

  rovo:mcp:
    - key: ll-assurance-mcp
      name: LineLock Verification MCP
      tools:
        - ll-act-inspect-eco
        - ll-act-sim-cutover
        - ll-act-baselines
        - ll-act-fleet-status

  action:
    - key: ll-act-inspect-eco
      name: Inspect ECO Assurance State
      function: rovo-inspect-fn
      actionVerb: GET
      description: Reads live Jira verification evidence and evaluates effectivity-scoped assurance, Strong Kleene K3 proof traces, remediation plans, and attestation status for an ECO issue key.
      inputs:
        issueKey:
          title: ECO Jira Issue Key
          type: string
          required: true
          description: Jira issue key of the Engineering Change Order (for example ECO-1).

    - key: ll-act-sim-cutover
      name: Simulate Counterfactual Serial Cutover
      function: rovo-sim-fn
      actionVerb: GET
      description: Runs a strictly read-only counterfactual simulation of flagship component substitution across a target serial interval and variant scope without mutating Forge SQL.
      inputs:
        issueKey:
          title: ECO Jira Issue Key
          type: string
          required: true
          description: Jira issue key of the Engineering Change Order (for example ECO-1).
        variantScope:
          title: Target Variant Scope
          type: string
          required: false
          description: Product variant scope to simulate (e.g. 'VAR_400V', 'VAR_ADULT_ICU', 'VAR_REGIONAL_TURBOPROP', or 'ALL').
        serialFrom:
          title: Serial Cutover Start
          type: integer
          required: false
          description: Starting unit serial number >= 1000 for the counterfactual substitution (default 5000).
        serialTo:
          title: Serial Cutover End
          type: integer
          required: false
          description: Optional upper unit serial bound > serialFrom for a temporary lot-bounded deviation.

    - key: ll-act-baselines
      name: Compare ECO Against Industry Baselines
      function: rovo-base-fn
      actionVerb: GET
      description: Audits discrepancies between LineLock and B0 (timestamp freshness), B1 (untyped ALM suspect links), and B2 (version + standard envelope) on an ECO issue.
      inputs:
        issueKey:
          title: ECO Jira Issue Key
          type: string
          required: true
          description: Jira issue key of the Engineering Change Order (for example ECO-1).

    - key: ll-act-fleet-status
      name: Inspect Space-Wide Fleet Assurance Status
      function: rovo-fleet-fn
      actionVerb: GET
      description: Evaluates all initialized ECO workspaces in a Jira project space against live Jira state, aggregating release gate readiness, Strong Kleene K3 verdict distributions, and B0/B1/B2 baseline discrepancies.
      inputs:
        projectKey:
          title: Jira Project Space Key
          type: string
          required: true
          description: Jira project space key to audit across all initialized ECOs (for example ECO).

  trigger:
    - key: ll-issue-reconciler
      function: issue-updated-fn
      events:
        - avi:jira:updated:issue
    - key: ll-lifecycle-trigger
      function: lifecycle-fn
      events:
        - avi:forge:installed:app
        - avi:forge:upgraded:app

  consumer:
    - key: ll-migration-consumer
      queue: schema-migration-queue
      function: migration-worker-fn

  sql:
    - key: main
      engine: mysql

  function:
    - key: panel-resolver-fn
      handler: forge/index.panelResolverHandler
    - key: workflow-validator-fn
      handler: forge/index.workflowValidatorHandler
    - key: issue-updated-fn
      handler: forge/index.issueUpdatedTriggerHandler
    - key: lifecycle-fn
      handler: forge/index.lifecycleInstallTriggerHandler
    - key: migration-worker-fn
      handler: forge/index.migrationQueueConsumerHandler
    - key: rovo-inspect-fn
      handler: forge/index.rovoInspectEcoHandler
    - key: rovo-sim-fn
      handler: forge/index.rovoSimulateCutoverHandler
    - key: rovo-base-fn
      handler: forge/index.rovoCompareBaselinesHandler
    - key: rovo-fleet-fn
      handler: forge/index.rovoFleetOverviewHandler

resources:
  - key: main-ui
    path: src/frontend/index.tsx
  - key: fleet-ui
    path: src/frontend/fleetPage.tsx

permissions:
  scopes:
    - storage:app
    - read:jira-work
    - write:jira-work
    - read:jira-user

app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/806d313b-57d3-41d5-b781-73e48a1effe7
