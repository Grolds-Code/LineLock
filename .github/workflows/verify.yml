name: LineLock Verification & Forge Bundle CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.5"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run strict typecheck, adversarial suite, benchmark & Forge bundler
        run: npm run verify
